<div class="backdrop" ui-sref="^"></div>

<div class="inner-container" go-back>

    <div class="custom-modal" id="quickpick-modal">
        <div id="picker" class="modal-dialog">
            <div class="modal-content animated fadeInDown">
                <div class="modal-header">{{ 'QUICK_PICK' | translate }}</div>

                <div class="modal-body">

                    <textarea id="quickPicker" placeholder="{{ 'QUICK_PICK_PLACEHOLDER' | translate }}"
                        ng-model="quickPickContent" quick-pick auto-focus>
                    </textarea>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-primary" ng-click="quickPick()">{{ 'OKAY' | translate }}</button> 
                    <button class="btn btn-default" ui-sref="^">{{ 'CLOSE' | translate }}</button> 
                </div>

            </div>
        </div>
    </div>

</div>
